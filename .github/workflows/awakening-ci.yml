name: "Marvel Awakening — CI (Testes do Motor)"

on:
  push:
    paths:
      - "awakening-engine/**"
  pull_request:
    paths:
      - "awakening-engine/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rodar testes determinísticos do motor d616
        run: node --test awakening-engine/tests/awakening.test.mjs
