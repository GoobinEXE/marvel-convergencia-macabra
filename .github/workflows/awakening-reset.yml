name: "Marvel Awakening — 5. Resetar Respostas (Manter Mesmos Códigos)"

on:
  repository_dispatch:
    types: [marvel-awakening-reset]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marvel-awakening-state
  cancel-in-progress: false

jobs:
  reset-responses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apagar respostas e manter os mesmos códigos das 5 vagas
        run: node awakening-engine/cli/reset-session.mjs

      - name: Salvar estado limpo no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state/ docs/
          if ! git diff --staged --quiet; then
            git commit -m "chore(awakening): respostas resetadas mantendo os mesmos códigos"
            git pull --rebase
            git push
          fi
