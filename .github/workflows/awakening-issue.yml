name: "Marvel Awakening — 4. Processar Formulário Web / Issue"

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: marvel-awakening-state
  cancel-in-progress: false

jobs:
  process-issue:
    if: contains(github.event.issue.title, '[AWAKEN]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extrair respostas da Issue e executar motor d616
        id: run_engine
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node - << 'EOF'
          import { spawnSync } from "node:child_process";
          import fs from "node:fs";

          const body = process.env.ISSUE_BODY || "";
          function extract(heading) {
            const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const re = new RegExp(`### ${escaped}\\s+([\\s\\S]*?)(?=\\n### |$)`);
            const m = body.match(re);
            return m ? m[1].trim() : "";
          }

          const slotCode = extract("Código da Vaga").toUpperCase();
          const playerName = extract("Nome do Jogador");
          const civilName = extract("Nome Civil do Personagem");
          const civilAge = extract("Idade");
          const civilOccupation = extract("Ocupação Civil");
          const visualAppearance = extract("Aparência Visual (Pessoa Normal)");
          const prePowerHistory = extract("Histórico Pré-Poderes");
          const q1 = extract("1. Quando tudo dá errado e o perigo é imediato, qual é o primeiro reflexo do seu personagem?").slice(0, 1);
          const q2 = extract("2. O que mais marcou a história passada do seu personagem até hoje?").slice(0, 1);
          const q3 = extract("3. Em um grupo tentando sobreviver a uma crise, qual é o primeiro papel que combina mais com a personalidade dele?") ||
                     extract("3. Em um grupo tentando sobreviver a uma crise, qual papel combina mais com a personalidade dele?").slice(0, 1);
          const words = extract("4. Sincronização de Palavras (Escolha exatamente 5 separadas por vírgula)");

          const res = spawnSync("node", ["awakening-engine/cli/submit-slot.mjs"], {
            env: {
              ...process.env,
              SLOT_CODE: slotCode,
              PLAYER_NAME: playerName,
              CIVIL_NAME: civilName,
              CIVIL_AGE: civilAge,
              CIVIL_OCCUPATION: civilOccupation,
              VISUAL_APPEARANCE: visualAppearance,
              PRE_POWER_HISTORY: prePowerHistory,
              ANSWER_Q1: q1,
              ANSWER_Q2: q2,
              ANSWER_Q3: q3.slice(0, 1),
              SELECTED_WORDS: words,
              AUTO_CONVERGE: "true",
            },
            encoding: "utf8",
          });

          console.log(res.stdout);
          if (res.status !== 0) {
            console.error(res.stderr);
            fs.writeFileSync("/tmp/awaken_comment.md", `❌ **Erro ao processar submissão (${slotCode}):**\n\`\`\`\n${res.stderr || res.stdout}\n\`\`\``);
            process.exit(1);
          }

          fs.writeFileSync("/tmp/awaken_comment.md", `✅ **Submissão registrada no GitHub Actions para \`${slotCode}\`!**\n\n\`\`\`\n${res.stdout.trim()}\n\`\`\`\n\nConsulte o painel atualizado em: https://goobinexe.github.io/marvel-convergencia-macabra/`);
          EOF

      - name: Commit e Push do estado atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ docs/
          if ! git diff --staged --quiet; then
            git commit -m "chore(awakening): submissão via formulário issue #${{ github.event.issue.number }}"
            git pull --rebase
            git push
          fi

      - name: Comentar resultado e fechar Issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          if [ -f /tmp/awaken_comment.md ]; then
            gh issue comment "$ISSUE_NUM" --body-file /tmp/awaken_comment.md --repo "${{ github.repository }}"
          fi
          gh issue close "$ISSUE_NUM" --repo "${{ github.repository }}"
