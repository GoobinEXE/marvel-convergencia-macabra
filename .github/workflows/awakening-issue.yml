name: "Marvel Awakening — 4. Processar Formulário Web / Issue"

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: marvel-awakening-state
  cancel-in-progress: false

jobs:
  process-issue:
    if: contains(github.event.issue.title, '[AWAKEN]') || contains(github.event.issue.title, '[AWAKEN-RESET]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Processar Reset (Apenas Mestre) ou Submissão de Jogador
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_NAME: ${{ github.repository }}
        run: |
          node - << 'EOF'
          import { spawnSync } from "node:child_process";
          import fs from "node:fs";
          import { sha256Hex } from "./awakening-engine/engine/prng.js";
          import { loadSession } from "./awakening-engine/cli/stateIO.mjs";

          const title = process.env.ISSUE_TITLE || "";
          const body = process.env.ISSUE_BODY || "";
          const author = process.env.ISSUE_AUTHOR || "";
          const repo = process.env.REPO_NAME || "GoobinEXE/marvel-convergencia-macabra";

          function extract(heading) {
            const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const re = new RegExp(`### ${escaped}\\s+([\\s\\S]*?)(?=\\n### |$)`);
            const m = body.match(re);
            return m ? m[1].trim() : "";
          }

          if (title.includes("[AWAKEN-RESET]")) {
            const session = loadSession();
            const masterCodeInput = extract("Código do Mestre");
            const inputHash = sha256Hex(masterCodeInput);

            if (author !== "GoobinEXE" || !session.masterCodeHash || inputHash !== session.masterCodeHash) {
              fs.writeFileSync(
                "/tmp/awaken_comment.md",
                `⛔ **Acesso Negado:** Apenas o Mestre (\`GoobinEXE\`) com o Código Secreto do Mestre válido pode resetar as respostas.`
              );
              process.exit(1);
            }

            const res = spawnSync("node", ["awakening-engine/cli/reset-session.mjs"], { encoding: "utf8" });
            console.log(res.stdout);
            fs.writeFileSync(
              "/tmp/awaken_comment.md",
              `🔄 **Respostas apagadas com sucesso pelo Mestre!**\n\nTodas as 5 vagas voltaram para \`PENDENTE\` mantendo os mesmos códigos secretos.\n\n* Painel: https://goobinexe.github.io/marvel-convergencia-macabra/`
            );
            process.exit(0);
          }

          const slotCode = extract("Código da Vaga").toUpperCase();
          const playerName = extract("Nome do Jogador");
          const civilName = extract("Nome Civil do Personagem");
          const civilAge = extract("Idade");
          const civilOccupation = extract("Ocupação Civil");
          const visualAppearance = extract("Aparência Visual (Pessoa Normal)");
          const prePowerHistory = extract("Histórico Pré-Poderes");
          const q1 = extract("1. Quando tudo dá errado e o perigo é imediato, qual é o primeiro reflexo do seu personagem?").slice(0, 1);
          const q2 = extract("2. O que mais marcou a história passada do seu personagem até hoje?").slice(0, 1);
          const q3 = (
            extract("3. Em um grupo tentando sobreviver a uma crise, qual é o primeiro papel que combina mais com a personalidade dele?") ||
            extract("3. Em um grupo tentando sobreviver a uma crise, qual papel combina mais com a personalidade dele?")
          ).slice(0, 1);
          const words =
            extract("4. Sincronização de Palavras (Escolha exatamente 5 EM ORDEM de importância, separadas por vírgula)") ||
            extract("4. Sincronização de Palavras (Escolha exatamente 5 separadas por vírgula)");

          const res = spawnSync("node", ["awakening-engine/cli/submit-slot.mjs"], {
            env: {
              ...process.env,
              SLOT_CODE: slotCode,
              PLAYER_NAME: playerName,
              CIVIL_NAME: civilName,
              CIVIL_AGE: civilAge,
              CIVIL_OCCUPATION: civilOccupation,
              VISUAL_APPEARANCE: visualAppearance,
              PRE_POWER_HISTORY: prePowerHistory,
              ANSWER_Q1: q1,
              ANSWER_Q2: q2,
              ANSWER_Q3: q3,
              SELECTED_WORDS: words,
              AUTO_CONVERGE: "true",
            },
            encoding: "utf8",
          });

          console.log(res.stdout);
          if (res.status !== 0) {
            console.error(res.stderr);
            fs.writeFileSync(
              "/tmp/awaken_comment.md",
              `❌ **Erro ao processar submissão:**\n\`\`\`\n${res.stderr || res.stdout}\n\`\`\``
            );
            process.exit(1);
          }

          const matchVaga = res.stdout.match(/Vaga #(\d+)/);
          const vagaNum = matchVaga ? matchVaga[1] : "1";
          const formUrl = `https://github.com/${repo}/blob/main/state/respostas/Vaga-0${vagaNum}.md`;

          fs.writeFileSync(
            "/tmp/awaken_comment.md",
            `✅ **Submissão registrada no GitHub Actions para a Vaga #${vagaNum}!**\n\n\`\`\`\n${res.stdout.trim()}\n\`\`\`\n\n* 📄 **Formulário completo gerado no repositório:** [state/respostas/Vaga-0${vagaNum}.md](${formUrl})\n* 🌐 **Portal atualizado:** https://goobinexe.github.io/marvel-convergencia-macabra/`
          );
          EOF

      - name: Commit e Push do estado e formulários
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state/ docs/
          if ! git diff --staged --quiet; then
            git commit -m "chore(awakening): atualizar estado e formulários via issue #${{ github.event.issue.number }}"
            git pull --rebase
            git push
          fi

      - name: Comentar resultado e fechar Issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          if [ -f /tmp/awaken_comment.md ]; then
            gh issue comment "$ISSUE_NUM" --body-file /tmp/awaken_comment.md --repo "${{ github.repository }}"
          fi
          gh issue close "$ISSUE_NUM" --repo "${{ github.repository }}"
