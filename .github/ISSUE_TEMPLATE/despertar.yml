name: "Despertar de Poderes — Enviar Respostas (d616)"
description: "Preencha seu código secreto de vaga, identidade civil, 3 perguntas e 5 palavras EM ORDEM de prioridade."
title: "[AWAKEN] Submissão de Jogador"
labels: ["awakening-submit"]
body:
  - type: input
    id: slot_code
    attributes:
      label: "Código da Vaga"
      description: "Código individual e secreto enviado em particular pelo Mestre"
      placeholder: "X616-XXXX"
    validations:
      required: true

  - type: input
    id: player_name
    attributes:
      label: "Nome do Jogador"
      placeholder: "Seu nome"
    validations:
      required: true

  - type: input
    id: civil_name
    attributes:
      label: "Nome Civil do Personagem"
      placeholder: "Nome da pessoa normal antes dos poderes"
    validations:
      required: true

  - type: input
    id: civil_age
    attributes:
      label: "Idade"
      placeholder: "Ex.: 25"
    validations:
      required: false

  - type: input
    id: civil_occupation
    attributes:
      label: "Ocupação Civil"
      placeholder: "Ex.: Boxeador, Jornalista, Cientista, Estudante..."
    validations:
      required: false

  - type: textarea
    id: visual_appearance
    attributes:
      label: "Aparência Visual (Pessoa Normal)"
      placeholder: "Descreva como seu personagem se parece antes de receber poderes"
    validations:
      required: false

  - type: textarea
    id: pre_power_history
    attributes:
      label: "Histórico Pré-Poderes"
      placeholder: "Resumo da vida civil e personalidade"
    validations:
      required: false

  - type: dropdown
    id: answer_q1
    attributes:
      label: "1. Falta energia no prédio ou na rua à noite e você está com amigos ou vizinhos. O que essa pessoa faz primeiro?"
      options:
        - "A) Abre o portão pesado da garagem no braço, carrega as compras ou ajuda alguém a subir as escadas."
        - "B) Desce rápido para pegar velas, busca lanterna no carro e dá uma volta na rua para ver se a luz caiu no quarteirão inteiro."
        - "C) Puxa conversa no corredor para acalmar quem ficou nervoso e mantém o clima leve até a energia voltar."
        - "D) Vai direto olhar o quadro de disjuntores, checa o aplicativo da companhia elétrica e organiza quem tem bateria no celular."
        - "E) Já tinha deixado uma lanterna carregada num lugar fácil e percebe logo pelo movimento do corredor quem precisa de ajuda."
    validations:
      required: true

  - type: dropdown
    id: answer_q2
    attributes:
      label: "2. No trabalho, na faculdade ou na rotina da semana, pelo que os conhecidos mais reconhecem essa pessoa?"
      options:
        - "A) Por ter disposição física, gostar de academia, esporte de contato ou nunca fugir de serviço pesado."
        - "B) Por ter ótimo reflexo no trânsito, mandar bem em jogos de mira ou resolver tarefas manuais com rapidez."
        - "C) Por saber conversar com qualquer pessoa, convencer os outros com facilidade e guardar bem os próprios assuntos."
        - "D) Por ser organizada, resolver problemas técnicos, montar coisas ou pesquisar assuntos difíceis até entender tudo."
        - "E) Por reparar em detalhes que passam batido pelos outros, lembrar de fisionomias e notar rápido quando alguém está diferente."
    validations:
      required: true

  - type: dropdown
    id: answer_q3
    attributes:
      label: "3. Num churrasco ou encontro de amigos em que nada foi planejado direito, qual papel acaba caindo no colo dela?"
      options:
        - "A) Carregar o cooler cheio, mexer na churrasqueira ou resolver o que precisa de força física."
        - "B) Sair de última hora para buscar gelo e bebida antes que o mercado feche."
        - "C) Receber o pessoal, quebrar o gelo entre quem não se conhece e animar a mesa."
        - "D) Fazer a lista do que falta, dividir a conta no final e organizar os horários."
        - "E) Lembrar onde cada um deixou a chave ou o celular, ver quando a comida está passando do ponto e notar quem está sem copo."
    validations:
      required: true

  - type: input
    id: selected_words
    attributes:
      label: "4. Sincronização de Palavras (Escolha exatamente 5 EM ORDEM de importância, separadas por vírgula)"
      description: "A ordem (1ª a 5ª) altera a pontuação e desempata! Lista (15 palavras): Impacto, Resistência, Firmeza, Precisão, Fuga, Reflexo, Névoa, Segredo, Sussurro, Sonho, Estratégia, Controle, Instinto, Presságio, Alerta"
      placeholder: "1ª Palavra, 2ª Palavra, 3ª Palavra, 4ª Palavra, 5ª Palavra"
    validations:
      required: true
