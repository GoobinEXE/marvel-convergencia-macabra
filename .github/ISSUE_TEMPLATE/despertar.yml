name: "Despertar de Poderes — Enviar Respostas (d616)"
description: "Preencha seu código secreto de vaga, identidade civil, 3 perguntas e 5 palavras EM ORDEM de prioridade."
title: "[AWAKEN] Submissão de Jogador"
labels: ["awakening-submit"]
body:
  - type: input
    id: slot_code
    attributes:
      label: "Código da Vaga"
      description: "Código individual e secreto enviado em particular pelo Mestre"
      placeholder: "X616-XXXX"
    validations:
      required: true

  - type: input
    id: player_name
    attributes:
      label: "Nome do Jogador"
      placeholder: "Seu nome"
    validations:
      required: true

  - type: input
    id: civil_name
    attributes:
      label: "Nome Civil do Personagem"
      placeholder: "Nome da pessoa normal antes dos poderes"
    validations:
      required: true

  - type: input
    id: civil_age
    attributes:
      label: "Idade"
      placeholder: "Ex.: 25"
    validations:
      required: false

  - type: input
    id: civil_occupation
    attributes:
      label: "Ocupação Civil"
      placeholder: "Ex.: Boxeador, Jornalista, Cientista, Estudante..."
    validations:
      required: false

  - type: textarea
    id: visual_appearance
    attributes:
      label: "Aparência Visual (Pessoa Normal)"
      placeholder: "Descreva como seu personagem se parece antes de receber poderes"
    validations:
      required: false

  - type: textarea
    id: pre_power_history
    attributes:
      label: "Histórico Pré-Poderes"
      placeholder: "Resumo da vida civil e personalidade"
    validations:
      required: false

  - type: dropdown
    id: answer_q1
    attributes:
      label: "1. Começa uma discussão feia ou um empurra-empurra na rua ou num bar lotado. O que o seu personagem faz na hora?"
      options:
        - "A) Entra na frente para separar ou segurar quem está alterado, mesmo correndo o risco de levar um soco."
        - "B) Sai do aperto rápido, pega distância e tenta resolver ou chamar ajuda de fora da confusão."
        - "C) Muda o assunto, inventa uma desculpa convincente ou desconversa até o clima esfriar sem ninguém notar que foi ele."
        - "D) Observa quem começou, procura a saída mais livre e tenta organizar as pessoas para ninguém se machucar."
        - "E) Já tinha percebido que ia dar briga minutos antes pelo jeito de alguém na mesa e avisa quem está perto antes do copo voar."
    validations:
      required: true

  - type: dropdown
    id: answer_q2
    attributes:
      label: "2. Olhando para a rotina e o passado dele antes de qualquer coisa estranha acontecer, o que sempre descreveu bem essa pessoa?"
      options:
        - "A) Trabalho braçal, academia, luta de fim de semana ou o costume de aguentar peso e cansaço sem reclamar."
        - "B) Esportes de mira, videogame, dirigir bem no aperto ou sempre dar um jeito ágil de sair de furada."
        - "C) Guardar segredos, mudar de assunto quando fica desconfortável ou saber ler o humor de qualquer roda de conversa."
        - "D) Gostar de montar coisas, resolver quebra-cabeças, organizar planilhas ou ter um sonho esquisito que nunca soube explicar."
        - "E) Ter o sono leve, notar detalhes que ninguém vê na rua ou desconfiar rápido quando algo está fora do lugar."
    validations:
      required: true

  - type: dropdown
    id: answer_q3
    attributes:
      label: "3. Numa viagem de carro com amigos em que o pneu fura à noite na estrada, sem sinal de celular, qual função acaba sobrando para ele?"
      options:
        - "A) Pegar o macaco, soltar os parafusos duros e fazer a força bruta para trocar a roda."
        - "B) Correr até um ponto mais alto ou seguro para sinalizar o trânsito e tentar pegar sinal."
        - "C) Manter o pessoal calmo, puxar conversa para ninguém entrar em pânico ou convencer algum motorista a parar."
        - "D) Ler o mapa, dividir as tarefas do grupo e calcular quanto tempo e combustível ainda restam."
        - "E) Ficar de olho no movimento da pista, nos barulhos do mato e em quem está se aproximando no escuro."
    validations:
      required: true

  - type: input
    id: selected_words
    attributes:
      label: "4. Sincronização de Palavras (Escolha exatamente 5 EM ORDEM de importância, separadas por vírgula)"
      description: "A ordem (1ª a 5ª) altera a pontuação e desempata! Lista (15 palavras): Impacto, Resistência, Firmeza, Precisão, Fuga, Reflexo, Névoa, Segredo, Sussurro, Sonho, Estratégia, Controle, Instinto, Presságio, Alerta"
      placeholder: "1ª Palavra, 2ª Palavra, 3ª Palavra, 4ª Palavra, 5ª Palavra"
    validations:
      required: true
